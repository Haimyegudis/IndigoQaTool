<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Install TestRail MCP for VS Code</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { --bg:#0f172a; --panel:#0b1220; --text:#e5e7eb; --muted:#9ca3af; --border:#1f2937; --accent:#3b82f6; --accent2:#22c55e; }
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(1200px 600px at 20% -10%,#1f2937 0%,#0f172a 60%);color:var(--text);font:15px/1.6 system-ui,-apple-system,Segoe UI,Roboto,Arial;padding:40px 20px}
    .wrap{max-width:1200px;margin:0 auto;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:26px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
    header{display:flex;gap:16px;align-items:center;margin-bottom:18px}
    h1{margin:0;font-size:22px}
    .grid{display:grid;grid-template-columns:1fr;gap:16px}
    @media (min-width:900px){.grid{grid-template-columns: 0.8fr 1.2fr}}
    label{display:block;margin:8px 0 6px;font-weight:600}
    input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:#0f172a;color:#e5e7eb}
    .row{background:#0f172a;border:1px solid var(--border);border-radius:12px;padding:16px}
    .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    a.btn{display:inline-block;text-decoration:none;padding:10px 14px;border-radius:10px;border:1px solid var(--border);font-weight:700}
    a.primary{background:var(--accent);color:#071225;border-color:#2563eb}
    a.success{background:var(--accent2);color:#06120a;border-color:#16a34a}
    .disabled{opacity:.45;pointer-events:none;filter:grayscale(30%)}
    .hint{color:var(--muted);font-size:13px;margin-top:10px}
    pre{margin:10px 0;padding:12px;background:#0a1220;border:1px solid var(--border);border-radius:10px;overflow:auto;font-size:13px;max-height:420px;white-space:pre-wrap;word-break:break-word}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div><h1>TestRail MCP Installer</h1></div>
    </header>
    <div class="grid">
      <div class="row">
        <label for="name">MCP Server Name</label>
        <input id="name" type="text" placeholder="TestRailMcp" value="TestRailMcp" autocomplete="off" />
        <label for="userPrefix">TestRail User</label>
        <input id="userPrefix" type="text" placeholder="user@example.com" autocomplete="off" />
        <label for="projectId">TestRail Project ID</label>
        <input id="projectId" type="text" placeholder="e.g. 123" autocomplete="off" />
        <label for="apiKey">TestRail Personal API Key</label>
        <input id="apiKey" type="text" placeholder="Enter TestRail personal API key" autocomplete="off" />
        <div class="btns">
          <a id="vscodeLink" class="btn primary disabled" href="#" role="button">Install in VS Code</a>
          <a id="insidersLink" class="btn success disabled" href="#" role="button">Install in VS Code Insiders</a>
        </div>
        <div class="hint">Buttons enable when all fields are valid. Place the EXE next to this HTML before installing.</div>
      </div>
      <div class="row">
        <strong>Preview of installed server</strong>
        <pre id="serverObj" aria-label="payload"></pre>
        <div class="hint">Absolute path is computed from this HTML's folder.</div>
      </div>
    </div>
  </div>
  <script>
    (function(){
      const exeName = "Tools.ExternalDevServices.AI.MCP.TestRailMcp.exe";
      const u = new URL(window.location.href);
      let p = decodeURIComponent(u.pathname);
      if (/^\/[A-Za-z]:\//.test(p)) p = p.slice(1);
      const dir = p.replace(/\\/g, "/").replace(/\/[^/]*$/, "");
      const exePathWin = (dir + "/" + exeName).replace(/\//g, "\\");
      const nameEl = document.getElementById("name");
      const userEl = document.getElementById("userPrefix");
      const projectEl = document.getElementById("projectId");
      const keyEl = document.getElementById("apiKey");
      const vs = document.getElementById("vscodeLink");
      const vsi = document.getElementById("insidersLink");
      const preview = document.getElementById("serverObj");
      function sanitize(v){return (v||"").trim().replace(/[^A-Za-z0-9._-]/g,"");}
      function buildServer(){
        const name = sanitize(nameEl.value) || "TestRailMcp";
        const userFull = userEl.value.trim();
        const projectId = projectEl.value.trim();
        return { name, type: "stdio", command: exePathWin, args: ["--user", userFull, "--project-id", projectId, "--personal-api-key", keyEl.value] };
      }
      function valid(){
        const nameOk = sanitize(nameEl.value||"TestRailMcp").length>0;
        const userOk = (userEl.value||"").trim().length>0;
        const projectOk = (projectEl.value||"").trim().length>0;
        const keyOk = (keyEl.value||"").trim().length>0;
        return nameOk && userOk && projectOk && keyOk;
      }
      function updateUI(){
        const srv = buildServer();
        if(srv.args[1]==="") srv.args.splice(0,2); // remove empty user pair if blank
        preview.textContent = JSON.stringify(srv,null,2);
        const enabled = valid();
        const enc = encodeURIComponent(JSON.stringify(srv));
        const href = `vscode:mcp/install?${enc}`;
        const hrefI = `vscode-insiders:mcp/install?${enc}`;
        vs.href = enabled ? href : "#";
        vsi.href = enabled ? hrefI : "#";
        vs.classList.toggle("disabled", !enabled);
        vsi.classList.toggle("disabled", !enabled);
      }
      nameEl.addEventListener("input", updateUI);
      userEl.addEventListener("input", updateUI);
      projectEl.addEventListener("input", updateUI);
      keyEl.addEventListener("input", updateUI);
      updateUI();
    })();
  </script>
</body>
</html>
